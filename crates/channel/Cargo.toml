[package]
name = "hellas-channel"
description = "Durable channel orchestration, funding and journals"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[features]
test-support = ["dep:bytes", "hellas-auth/test-support", "hellas-wire/mux"]

[dependencies]
async-stream.workspace = true
async-trait = "0.1"
base64.workspace = true
bytes = { workspace = true, optional = true }
futures.workspace = true
getrandom = "0.4"
hellas-auth.workspace = true
hellas-kernel = { workspace = true, features = ["secp256k1", "webauthn"] }
hellas-private.workspace = true
hellas-rpc = { workspace = true, features = ["fetch", "work"] }
hellas-store.workspace = true
hellas-webauthn.workspace = true
hellas-wire.workspace = true
hellas-xet.workspace = true
hex.workspace = true
k256.workspace = true
prost = { version = "0.14", default-features = false, features = ["derive"] }
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url = "2"

[dev-dependencies]
bytes.workspace = true
hellas-channel = { workspace = true, features = ["test-support"] }
hellas-wire = { workspace = true, features = ["mux"] }
proptest = "1.11"
