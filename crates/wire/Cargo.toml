[package]
name = "hellas-wire"
description = "Transport-agnostic RPC wire layer for the Hellas protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[features]
default = []

# Transports
iroh = ["dep:iroh", "dep:n0-future", "dep:portable-atomic", "dep:tokio-stream"]
# Discovery backends. `discovery-dht` pulls in `mainline` for the shared shard
# buckets, plus crypto/encoding deps shared with `discovery-mdns`.
discovery-dht = [
    "iroh",
    "dep:mainline",
    "dep:async-stream",
    "dep:postcard",
    "dep:serde",
    "dep:sha2",
]
discovery-mdns = [
    "iroh",
    "dep:async-stream",
    "dep:data-encoding",
    "dep:iroh-mdns-address-lookup",
    "dep:postcard",
]
# Mux is shared infrastructure for transports without native substreams.
mux = []
ws = ["mux", "dep:tokio-tungstenite"]
# Local native transport: a Unix socket, or an owner-authenticated named pipe
# on Windows. `mux` keeps the RPC framing and service dispatch identical to
# WebSocket carriers.
unix = [
    "mux",
    "tokio/net",
    "dep:blake3",
    "dep:hellas-private",
    "dep:windows-sys",
]
# Opt-in TLS for native WebSocket clients. Keeping this separate from `ws`
# preserves a TLS-free transport build for constrained native targets.
ws-rustls = ["ws", "dep:rustls", "tokio-tungstenite/rustls-tls-webpki-roots"]
ws-wasm = ["mux", "dep:ws_stream_wasm", "dep:wasm-bindgen-futures"]

[dependencies]

# Discovery backend deps (gated behind discovery-{dht,mdns}).
async-stream = { workspace = true, optional = true }
bytes = { workspace = true }
data-encoding = { version = "2", optional = true }
futures = { workspace = true }
futures-core = { workspace = true }
hellas-xet = { workspace = true, features = ["chunking"] }

# Optional transport deps
iroh = { workspace = true, optional = true }
iroh-mdns-address-lookup = { workspace = true, optional = true }
mainline = { version = "7", optional = true }
n0-future = { version = "0.3", default-features = false, optional = true }

# Xtensa (esp32-s3) lacks native 64-bit atomics; portable-atomic
# provides a mutex-fallback `AtomicU64` so the iroh ConnectionPool's
# generation counter compiles on embedded targets.
portable-atomic = { version = "1", default-features = false, features = [
    "fallback",
], optional = true }
postcard = { version = "1", default-features = false, features = [
    "alloc",
], optional = true }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
], optional = true }
serde = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
smol_str = { workspace = true }
thiserror = { workspace = true }
tokio-stream = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
tracing = { workspace = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-time = { workspace = true }
ws_stream_wasm = { version = "0.7", optional = true }

[target.'cfg(all(unix, not(target_os = "espidf")))'.dependencies]
libc = "0.2"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true, features = [
    "io-util",
    "sync",
    "macros",
    "rt",
    "time",
] }

[target.'cfg(target_family = "wasm")'.dependencies]
tokio = { version = "1", default-features = false, features = [
    "sync",
    "macros",
] }

[target.'cfg(windows)'.dependencies]
blake3 = { version = "1", optional = true }
hellas-private = { workspace = true, optional = true }
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_System_Pipes",
] }

[dev-dependencies]
iroh = { workspace = true, features = ["tls-ring"] }
tokio = { workspace = true, features = ["full"] }
