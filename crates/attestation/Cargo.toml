[package]
name = "hellas-attestation"
description = "Attestation evidence for Hellas receipts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[features]
default = []
apple-app-attest = [
    "dep:base64",
    "dep:ciborium",
    "dep:p256",
    "dep:rustls-pki-types",
    "dep:webpki",
    "dep:serde",
    "dep:serde_bytes",
    "dep:sha2",
    "dep:x509-cert",
]

[dependencies]
base64 = { workspace = true, optional = true }
ciborium = { workspace = true, optional = true }
hellas-auth.workspace = true
hellas-rpc = { workspace = true, features = ["execute"] }
p256 = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_bytes = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
thiserror.workspace = true
webpki = { workspace = true, default-features = false, features = [
    "ring",
    "std",
], optional = true }
x509-cert = { workspace = true, optional = true }

[dev-dependencies]
hex.workspace = true
