[package]
name = "hellas-rpc"
description = "RPC implementation for the Hellas node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[package.metadata.cargo-machete]
ignored = [
    "prettyplease",
    "proc-macro2",
    "prost-build",
    "prost-types",
    "protox",
    "quote",
    "syn",
]

[features]
default = []
http-tracing = ["dep:axum", "dep:http-body"]
otel = ["dep:opentelemetry", "dep:tracing-opentelemetry"]

# === Protocol modules ======================================================
# Each feature gates the generated items for one proto package, so binaries
# only include the protocols they use.
# `execute` is the foundation — evaluate, fetch, and courtesy all reference
# `hellas.v1.Ticket` and related types.
execute = []
evaluate = ["execute"]
fetch = ["execute", "dep:serde_json"]
chain = ["dep:base64ct", "dep:hellas-kernel"]
# Courtesy proto imports hellas.v1 (Ticket) and hellas.evaluate.v1
# (EvaluateRequest), so the feature must pull both forward.
courtesy = ["execute", "evaluate"]
swarm = []
# Host administration. Explicitly mounted behind admin authorization, not
# included in the ordinary peer-service discovery catalogue.
host-control = []
all-protocols = ["swarm", "courtesy", "execute", "evaluate", "fetch", "chain"]
# Paid private work: the canonical authorization, result, invoice, and
# allocation records. Gated because it is the only protocol module that
# needs the consensus kernel's types — the certificate, the network id,
# and the edge/terms commitments — and a wasm or fetch-only client has no
# use for them. The alternative was restating those kernel types here,
# which is how two definitions of a signed digest start.
work = ["dep:hellas-kernel", "evaluate", "hellas-kernel/secp256k1"]

[dependencies]
axum = { workspace = true, optional = true }
base64ct = { version = "1", optional = true, features = ["alloc"] }
bytes = { workspace = true }
ed25519-dalek = { workspace = true }
futures-core = { workspace = true }
futures-util = { version = "0.3", default-features = false }
hellas-kernel = { workspace = true, optional = true }
hellas-wire = { workspace = true }
hellas-xet = { workspace = true, features = ["chunking", "serde"] }
http-body = { version = "1", optional = true }
k256 = { workspace = true }
n0-future = { version = "0.3", default-features = false }
opentelemetry = { workspace = true, optional = true }
p256 = { workspace = true }
prost = { version = "0.14", default-features = false, features = ["derive"] }
serde = { workspace = true }
serde_bytes = { workspace = true }
serde_ipld_dagcbor = { workspace = true }
serde_json = { workspace = true, optional = true }
smol_str = { workspace = true }
thiserror = { workspace = true }
# The measurement seams' one channel out. Nothing here decides on a
# sample, and a node with no subscriber pays one atomic load per seam.
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true, optional = true }
web-time = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[build-dependencies]
hellas-wire = { workspace = true, default-features = false }
prettyplease = "0.2"
proc-macro2 = "1"
prost-build = "0.14"
prost-types = "0.14"
protox = "0.9"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
# Real settlement signatures in the paid-work vectors: the kernel's own
# secp256k1 signer, not a placeholder that proves nothing about the keys
# a channel actually settles with.
hellas-kernel = { workspace = true, features = ["secp256k1"] }
# The paid-work acceptance test runs over a real multiplexed transport
# rather than a handler call: framing, method routing, and trailers are
# where a wire-shaped mistake actually shows up.
hellas-wire = { workspace = true, features = ["mux"] }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
hellas-wire = { workspace = true, features = ["unix", "ws"] }
tokio-tungstenite.workspace = true
