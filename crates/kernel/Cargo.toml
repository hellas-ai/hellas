[package]
name = "hellas-kernel"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
documentation.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = []
# Forgeable deterministic Sig/Seal placeholders for tests and modelling.
# Deliberately not part of any default or production feature set: a build
# without this feature physically cannot construct a placeholder witness.
placeholders = []
secp256k1 = ["dep:k256"]
test-support = ["placeholders", "webauthn"]
webauthn = ["dep:hellas-webauthn", "dep:p256"]

[dependencies]
hellas-webauthn = { workspace = true, optional = true }
hellas-xet = { workspace = true }
k256 = { version = "0.14", default-features = false, features = [
    "ecdsa",
], optional = true }
p256 = { workspace = true, optional = true }

[dev-dependencies]

allocation-counter = "0.8"
criterion = "0.8.2"
# Self-dependency so the crate's own integration tests, benches, and
# examples see the placeholder constructors without shipping them in
# production builds.
hellas-kernel = { path = ".", features = ["placeholders"] }
itf = "0.4"
proptest = "1"
proptest-state-machine = "0.9"
# Reference libsecp256k1 (C) kept for tests/examples only: signing with
# the independent Bitcoin implementation and verifying with the k256
# production path cross-validates that the two agree byte-for-byte.
secp256k1 = { version = "0.33", features = ["alloc"] }
serde = { workspace = true }
stateright = "0.31"

[[bench]]
name = "apply"
harness = false

[[example]]
name = "end_to_end"
required-features = ["secp256k1"]

[[example]]
name = "mixed_open_auth"
required-features = ["secp256k1", "webauthn"]

[lints.rust]
elided_lifetimes_in_paths = "deny"
missing_copy_implementations = "deny"
missing_debug_implementations = "deny"
missing_docs = "deny"
rust_2018_idioms = "deny"
unsafe_code = "forbid"
unreachable_pub = "deny"
unused_extern_crates = "deny"
unused_must_use = "deny"
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
alloc_instead_of_core = "deny"
dbg_macro = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
expect_used = "deny"
# Panic-freedom lock: every index/slice in the transition core must be
# `get`-based or carry a reviewed `#[allow]` stating why it cannot panic.
indexing_slicing = "deny"
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
print_stderr = "deny"
print_stdout = "deny"
std_instead_of_alloc = "deny"
std_instead_of_core = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"
