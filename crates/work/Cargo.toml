[package]
name = "hellas-work"
description = "Durable paid-work orchestration for Hellas endpoints"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[dependencies]
async-stream.workspace = true
base64.workspace = true
futures.workspace = true
hellas-kernel = { workspace = true, features = ["secp256k1"] }
hellas-private.workspace = true
hellas-rpc = { workspace = true, features = ["work"] }
hellas-wire.workspace = true
hellas-xet.workspace = true
prost = { version = "0.14", default-features = false, features = ["derive"] }
serde.workspace = true
serde_bytes.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
bytes.workspace = true
hellas-wire = { workspace = true, features = ["mux"] }
proptest = "1.11"
serde_json.workspace = true
tempfile.workspace = true
