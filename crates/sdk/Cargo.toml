[package]
name = "hellas-sdk"
description = "Transport-neutral composition facade for Hellas applications"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[features]
default = ["client", "apple-verifier"]
client = [
    "dep:futures-core",
    "dep:hellas-client",
    "dep:iroh",
    "hellas-client/iroh",
    "hellas-wire/iroh",
]
apple-verifier = ["hellas-attestation/apple-app-attest"]
gateway = ["dep:hellas-gateway"]
provider = [
    "client",
    "dep:anyhow",
    "dep:hellas-executor",
    "dep:hellas-providers",
    "dep:iroh",
    "dep:tokio",
    "dep:tracing",
    "hellas-wire/iroh",
]
local-control = ["dep:tokio", "hellas-rpc/host-control", "hellas-wire/unix"]

paid-work = [
    "dep:async-stream",
    "provider",
    "dep:hellas-chain",
    "hellas-chain/client",
    "hellas-chain/work-watcher",
    "dep:hellas-kernel",
    "hellas-kernel/secp256k1",
    "dep:hellas-work",
    "hellas-client/work",
    "hellas-rpc/work",
    "dep:futures",
    "dep:serde",
    "dep:serde_json",
    "dep:hex",
    "dep:url",
]

[dependencies]
anyhow = { workspace = true, optional = true }
async-stream = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
futures-core = { workspace = true, optional = true }
hellas-attestation.workspace = true
hellas-chain = { workspace = true, default-features = false, optional = true }
hellas-client = { workspace = true, optional = true }
hellas-executor = { workspace = true, default-features = false, optional = true }
hellas-gateway = { workspace = true, optional = true }
hellas-kernel = { workspace = true, default-features = false, optional = true }
hellas-providers = { workspace = true, optional = true }
hellas-rpc = { workspace = true, features = ["execute", "fetch", "courtesy"] }
hellas-wire = { workspace = true, features = ["mux"] }
hellas-work = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
iroh = { workspace = true, features = ["tls-ring"], optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["net", "sync"], optional = true }
tracing = { workspace = true, optional = true }
url = { version = "2", optional = true }

[dev-dependencies]
tokio.workspace = true
