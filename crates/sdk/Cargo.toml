[package]
name = "hellas-sdk"
description = "Native host composition for Hellas services and clients"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[dependencies]
async-stream = { workspace = true }
futures = { workspace = true }
futures-core = { workspace = true }
hellas-attestation = { workspace = true, features = ["apple-app-attest"] }
hellas-auth = { workspace = true }
hellas-authority = { workspace = true }
hellas-chain = { workspace = true, default-features = false, features = [
    "full-node",
    "proof-verify",
    "work-watcher",
] }
hellas-channel = { workspace = true }
hellas-client = { workspace = true, features = ["iroh", "work"] }
hellas-executor = { workspace = true, default-features = false }
hellas-gateway = { workspace = true }
hellas-kernel = { workspace = true, default-features = false, features = [
    "secp256k1",
    "webauthn",
] }
hellas-private = { workspace = true }
hellas-providers = { workspace = true }
hellas-rpc = { workspace = true, features = [
    "execute",
    "fetch",
    "work",
    "host-control",
] }
hellas-wire = { workspace = true, features = [
    "mux",
    "iroh",
    "unix",
    "tls",
    "discovery-mdns",
] }
hex = { workspace = true }
iroh = { workspace = true, features = ["tls-ring"] }
iroh-mdns-address-lookup = { workspace = true }
prost = { version = "0.14" }
rand = { workspace = true }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
] }
serde = { workspace = true }
serde_bytes = { workspace = true }
serde_json = { workspace = true }
subtle = "2"
tempfile = { workspace = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "sync"] }
toml.workspace = true
tracing = { workspace = true }
url = { version = "2" }
zeroize = { version = "1.9" }

[dev-dependencies]
async-trait = "0.1"
base64.workspace = true
bytes.workspace = true
commonware-codec.workspace = true
commonware-cryptography.workspace = true
commonware-runtime.workspace = true
hellas-authority = { workspace = true, features = ["test-support"] }
hellas-chain = { workspace = true, features = ["test-support"] }
hellas-channel = { workspace = true, features = ["test-support"] }
rcgen = "0.14"
reqwest = { workspace = true, features = ["json"] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
tokio = { workspace = true, features = ["test-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
] }
tokio-tungstenite.workspace = true
tracing-subscriber.workspace = true
