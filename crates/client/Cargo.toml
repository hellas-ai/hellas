[package]
name = "hellas-client"
description = "Reusable client orchestration for the Hellas protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[features]
default = []
iroh = [
    "dep:hellas-authority",
    "dep:hellas-adaptors",
    "dep:serde_ipld_dagcbor",
    "dep:tracing",
    "dep:async-stream",
    "dep:futures",
    "dep:iroh",
    "dep:iroh-mdns-address-lookup",
    "dep:hellas-attestation",
    "dep:tokio",
    "hellas-wire/iroh",
    "hellas-wire/discovery-dht",
    "hellas-wire/discovery-mdns",
]
# The paid-work half: the acceptance and delivery wire, and the
# independent reexecution check the client makes before a result is
# payable. Off by default because it pulls the consensus kernel into a
# client that may only want to fetch.
work = ["dep:hellas-kernel", "dep:hellas-channel"]
# Client-side model package: renders Compute jobs from model files.
models = [
    "work",
    "dep:anyhow",
    "dep:catena-models",
    "dep:hellas-store",
    "dep:safetensors",
    "dep:serde_json",
    "dep:tokenizers",
    "dep:tempfile",
    "dep:hound",
]

[dependencies]
anyhow = { workspace = true, optional = true }
async-stream = { workspace = true, optional = true }
catena-models = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
hellas-adaptors = { workspace = true, optional = true }
hellas-attestation = { workspace = true, features = [
    "apple-app-attest",
], optional = true }
hellas-auth.workspace = true
hellas-authority = { workspace = true, optional = true }
hellas-channel = { workspace = true, optional = true }
# The re-execution names the network its outcome is bound to, and that
# type is the consensus kernel's. `work` is the only feature that reaches
# it.
hellas-kernel = { workspace = true, optional = true }
hellas-rpc = { workspace = true, features = ["execute", "fetch"] }
hellas-store = { workspace = true, optional = true }
hellas-wire.workspace = true
hound = { version = "3.5", optional = true }
iroh = { workspace = true, features = ["tls-ring"], optional = true }
iroh-mdns-address-lookup = { workspace = true, optional = true }
rand.workspace = true
safetensors = { version = "0.8", optional = true }
serde.workspace = true
serde_ipld_dagcbor = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
tokenizers = { version = "0.23", default-features = false, features = [
    "onig",
], optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
base64.workspace = true
bytes.workspace = true
ciborium.workspace = true
hellas-authority = { workspace = true, features = ["test-support"] }
hellas-channel = { workspace = true, features = ["test-support"] }
hellas-kernel = { workspace = true, features = ["secp256k1"] }
# The paid-work path runs over a real multiplexed transport rather than a
# handler call: framing, method routing, and trailers are where a
# wire-shaped mistake actually shows up.
hellas-wire = { workspace = true, features = ["mux"] }
hex.workspace = true
p256.workspace = true
proptest = "1.11"
serde_bytes.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile = { workspace = true }
tokio.workspace = true
