[package]
name = "hellas-cli"
description = "Command-line interface for the Hellas node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[target.'cfg(unix)'.dependencies]
hellas-cloud.workspace = true
libc = "0.2"

[features]
default = []
test-support = ["hellas-cloud/test-support"]

# Local model execution additionally compiles Catena and the native evaluator.
evaluate = [
    "dep:catena-lang",
    "dep:commonware-runtime",
    "hellas-gateway/evaluate",
    "hellas-executor/evaluate",
]
indexer = ["hellas-chain/indexer-api"]
validator = ["indexer", "hellas-chain/validator"]

# Hellas OTLP export and iroh metrics exposure are opt-in. Dependencies can
# still compile telemetry: Commonware has its own SDK, and mDNS enables iroh
# default features (including metrics collection).
otel = [
    "hellas-chain/otel",
    "hellas-rpc/otel",
    "hellas-executor/otel",
    "hellas-gateway/otel",
    "hellas-providers/otel",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:iroh-metrics",
    "iroh/metrics",
]

[dependencies]
anyhow = { workspace = true }
async-stream = { workspace = true }
axum = { workspace = true }
base64.workspace = true
catena-lang = { workspace = true, optional = true }
clap = { version = "4", features = ["derive"] }
commonware-runtime = { workspace = true, optional = true }
futures = { workspace = true }
hellas-adaptors.workspace = true
hellas-attestation = { workspace = true, features = ["apple-app-attest"] }
hellas-auth.workspace = true
hellas-authority = { workspace = true }
hellas-chain = { workspace = true, default-features = false, features = [
    "client",
    "proof-verify",
    "work-watcher",
] }
hellas-channel = { workspace = true }
hellas-client = { workspace = true, features = ["iroh", "work", "evaluate"] }
hellas-executor = { workspace = true, default-features = false }
hellas-gateway.workspace = true
hellas-kernel = { workspace = true, default-features = false, features = [
    "secp256k1",
    "webauthn",
] }
hellas-presentation = { workspace = true }
hellas-private.workspace = true
hellas-providers.workspace = true
hellas-rpc = { workspace = true, default-features = false, features = [
    "all-protocols",
    "work",
    "host-control",
] }
hellas-sdk = { workspace = true, default-features = false }
hellas-store = { workspace = true }
hellas-wire = { workspace = true, features = [
    "unix",
    "iroh",
    "discovery-dht",
    "discovery-mdns",
] }
hellas-xet = { workspace = true }
hex.workspace = true
iroh = { workspace = true, features = ["tls-ring"] }
iroh-metrics = { version = "1", default-features = false, features = [
    "metrics",
], optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
prometheus-client = { workspace = true }
qrcode = { version = "0.14", default-features = false }
rand.workspace = true
rcgen = "0.14"
reqwest.workspace = true
serde.workspace = true
serde_ipld_dagcbor.workspace = true
serde_json.workspace = true
tempfile = { workspace = true }
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber.workspace = true

[dev-dependencies]
ciborium.workspace = true
commonware-cryptography.workspace = true
commonware-runtime.workspace = true
hellas-authority = { workspace = true, features = ["test-support"] }
hellas-chain = { workspace = true, features = ["client", "test-support"] }
hellas-channel = { workspace = true, features = ["test-support"] }
hellas-providers = { workspace = true, features = ["test-support"] }
p256.workspace = true
reqwest = { workspace = true, features = ["json"] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
serde_bytes.workspace = true
sha2.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
] }
