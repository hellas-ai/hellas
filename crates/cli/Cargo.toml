[package]
name = "hellas-cli"
description = "Command-line interface for the Hellas node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[features]
default = []

# Remote machine management; credentials stay with the operator identity.
cloud = ["dep:hellas-cloud"]

# Enables Apple App Attest verification for clients. Native enrollment and
# proof production belong to the signed host application (Gate), not the CLI.
apple-app-attest = []

# The node serves paid work, and paid work is a chain: the work config's
# threshold identity is decoded by consensus's own constructor, and the
# settlement watcher reads finalized blocks. So `node` reaches
# `hellas-chain` through the feature graph rather than through a second
# dependency. `work-watcher` is the adapter that pairs a light client
# with the block source, the sink and the finalized read a paid endpoint
# is driven from; without it the runner has a chain and no way to ask it
# anything.
node = [
    "dep:hellas-sdk",
    "hellas-sdk/paid-work",
    "chain",
    "dep:async-stream",
    "dep:axum",
    "dep:hellas-executor",
    "dep:prometheus-client",
    "dep:qrcode",
    "hellas-chain/work-watcher",
    "hellas-client/work",
    "dep:hellas-work",
]
# Token-native remote execution and its local text-presentation boundary.
# This deliberately does not pull Catena into a client that only dials a node.
llm = ["hellas-client/evaluate", "dep:hellas-presentation"]
# HTTP gateway front-end (OpenAI/Anthropic/plain APIs).
gateway = ["llm", "dep:hellas-gateway"]
evaluate = [
    "node",
    "gateway",
    "dep:catena-lang",
    "dep:commonware-runtime",
    "hellas-gateway/evaluate",
    "hellas-executor/evaluate",
    "dep:hellas-presentation",
]
chain = [
    "dep:hellas-chain",
    "dep:hellas-kernel",
    "hellas-chain/client",
    "hellas-kernel/secp256k1",
    "hellas-kernel/webauthn",
]
indexer = ["chain", "hellas-chain/indexer-api"]
validator = ["indexer", "hellas-chain/validator"]

# Hellas OTLP export and iroh metrics exposure are opt-in. Dependencies can
# still compile telemetry: Commonware has its own SDK, and mDNS enables iroh
# default features (including metrics collection).
otel = [
    "hellas-chain?/otel",
    "hellas-rpc/otel",
    "hellas-executor?/otel",
    "hellas-gateway?/otel",
    "hellas-providers/otel",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:iroh-metrics",
    "iroh/metrics",
]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dependencies]
anyhow = { workspace = true }
async-stream = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
base64.workspace = true
catena-lang = { workspace = true, optional = true }
clap = { version = "4", features = ["derive"] }
commonware-runtime = { workspace = true, optional = true }
futures = { workspace = true }
hellas-adaptors.workspace = true
hellas-attestation = { workspace = true, features = ["apple-app-attest"] }
hellas-chain = { workspace = true, default-features = false, optional = true }
hellas-client = { workspace = true, features = ["iroh"] }
hellas-cloud = { workspace = true, optional = true }
hellas-executor = { workspace = true, default-features = false, optional = true }
hellas-gateway = { workspace = true, optional = true }
hellas-kernel = { workspace = true, default-features = false, optional = true }
hellas-presentation = { workspace = true, optional = true }
hellas-private.workspace = true
hellas-providers.workspace = true
hellas-rpc = { workspace = true, default-features = false, features = [
    "all-protocols",
    "work",
    "host-control",
] }
hellas-sdk = { workspace = true, default-features = false, optional = true }
hellas-store = { workspace = true }
hellas-wire = { workspace = true, features = [
    "unix",
    "iroh",
    "discovery-dht",
    "discovery-mdns",
] }
hellas-work = { workspace = true, optional = true }
hellas-xet = { workspace = true }
hex.workspace = true
iroh = { workspace = true, features = ["tls-ring"] }
iroh-mdns-address-lookup = { workspace = true }
iroh-metrics = { version = "1", default-features = false, features = [
    "metrics",
], optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
prometheus-client = { workspace = true, optional = true }
qrcode = { version = "0.14", default-features = false, optional = true }
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_ipld_dagcbor.workspace = true
serde_json.workspace = true
tempfile = { workspace = true }
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber.workspace = true

[dev-dependencies]
ciborium.workspace = true
p256.workspace = true
serde_bytes.workspace = true
sha2.workspace = true
