[package]
name = "hellas-gateway"
description = "HTTP gateway for the Hellas execution network"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[features]
default = []
otel = [
    "hellas-rpc/otel",
    "hellas-rpc/http-tracing",
    "dep:opentelemetry",
    "dep:tracing-opentelemetry",
]
evaluate = [
    "dep:hellas-executor",
    "hellas-executor/evaluate",
    "hellas-client/local",
    "dep:hellas-store",
]

[dependencies]
anyhow = { workspace = true }
async-stream = { workspace = true }
axum = { workspace = true }
base64.workspace = true
httpdate = "1"
futures = { workspace = true }
hellas-adaptors.workspace = true
hellas-client = { workspace = true, features = ["iroh", "evaluate"] }
hellas-executor = { workspace = true, optional = true }
hellas-presentation.workspace = true
hellas-private.workspace = true
hellas-rpc = { workspace = true, features = ["courtesy", "fetch"] }
hellas-store = { workspace = true, optional = true }
hellas-wire = { workspace = true, features = ["iroh"] }
iroh.workspace = true
libc = "0.2"
opentelemetry = { workspace = true, optional = true }
prometheus-client.workspace = true
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing.workspace = true
tracing-opentelemetry = { workspace = true, optional = true }

[dev-dependencies]
hellas-rpc = { workspace = true, features = ["host-control"] }
hellas-wire = { workspace = true, features = ["unix"] }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tempfile = "3"
