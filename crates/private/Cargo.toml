[package]
name = "hellas-private"
description = "Files and local IPC endpoints that only the current user can reach"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
base64.workspace = true
dbus-secret-service-keyring-store = { version = "1", features = [
    "crypto-rust",
    "vendored",
] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[dependencies]
keyring-core = "1"
tempfile.workspace = true
zeroize = "1.9"
