[package]
name = "hellas-store"
description = "Content store addressed by Xet file hash"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dependencies]
async-trait = "0.1"
async-stream.workspace = true
bytes.workspace = true
futures-core.workspace = true
futures.workspace = true
tokio.workspace = true
hellas-auth.workspace = true
hellas-wire = { workspace = true, features = ["mux", "iroh"] }
iroh = { workspace = true, features = ["tls-ring"] }
sha2.workspace = true
prost = { version = "0.14", default-features = false, features = ["derive"] }
url = "2"
hellas-private.workspace = true
hellas-rpc.workspace = true
hellas-xet = { workspace = true, features = ["chunking"] }
lz4_flex = { version = "0.14", default-features = false, features = ["frame"] }
sqlx.workspace = true
serde.workspace = true
serde_ipld_dagcbor.workspace = true
serde_json = { workspace = true }
tempfile.workspace = true
thiserror = { workspace = true }
tracing.workspace = true
# Bundled Mozilla roots, matching the workspace `reqwest`. Deliberately
# NOT `platform-verifier`: two HTTP clients in one binary trusting two
# different sets of certificate authorities is a silent policy split,
# and "which roots did we trust when we fetched this content" should
# have one answer. Bundled roots also make that answer reproducible,
# independent of whatever an admin or MDM installed on the host.
ureq = { version = "3", default-features = false, features = [
    "rustls",
    "rustls-webpki-roots",
] }

[dev-dependencies]
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
