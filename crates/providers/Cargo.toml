[package]
name = "hellas-providers"
description = "Sealed upstream providers and response projectors for Hellas Fetch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[features]
default = []
otel = ["hellas-rpc/otel", "dep:hellas-wire"]

[dependencies]
base64.workspace = true
url = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
sha2.workspace = true
x509-cert.workspace = true
anyhow = { workspace = true }
async-stream = { workspace = true }
futures.workspace = true
hellas-adaptors.workspace = true
hellas-executor = { workspace = true, default-features = false }
hellas-rpc = { workspace = true, features = ["fetch"] }
hellas-private.workspace = true
hellas-wire = { workspace = true, optional = true }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
axum.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
