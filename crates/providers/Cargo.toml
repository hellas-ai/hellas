[package]
name = "hellas-providers"
description = "Sealed upstream providers and response projectors for Hellas Fetch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[features]
default = []
otel = ["hellas-rpc/otel", "dep:hellas-wire"]

[dependencies]
anyhow = { workspace = true }
async-stream = { workspace = true }
base64.workspace = true
futures.workspace = true
hellas-adaptors.workspace = true
hellas-executor = { workspace = true, default-features = false }
hellas-private.workspace = true
hellas-rpc = { workspace = true, features = ["fetch"] }
hellas-wire = { workspace = true, optional = true }
reqwest.workspace = true
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
url = "2"
webpki-roots = "1"
x509-cert.workspace = true

[dev-dependencies]
axum.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk = { workspace = true, features = ["testing"] }
rcgen = "0.14"
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
] }
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
