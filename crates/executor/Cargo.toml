[package]
name = "hellas-executor"
description = "Executor for the Hellas node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[features]
otel = ["hellas-rpc/otel", "dep:opentelemetry", "dep:tracing-opentelemetry"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dependencies]
async-trait = "0.1"
bincode = "3.0"
catena-lang.workspace = true
futures-core = { workspace = true }
futures-util = "0.3"
hellas-auth.workspace = true
hellas-channel.workspace = true
hellas-kernel = { workspace = true, features = ["secp256k1"] }
hellas-private.workspace = true
hellas-rpc = { workspace = true, features = ["execute", "fetch", "work"] }
hellas-store.workspace = true
hellas-wire = { workspace = true }
libloading = "0.9"
metacat = "0.3"
opentelemetry = { workspace = true, optional = true }
prometheus-client = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_ipld_dagcbor.workspace = true
serde_json = { workspace = true }
sha2.workspace = true
tempfile.workspace = true
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true, optional = true }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
ctor = "1"
hellas-channel = { workspace = true, features = ["test-support"] }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
