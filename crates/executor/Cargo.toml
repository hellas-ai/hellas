[package]
name = "hellas-executor"
description = "Executor for the Hellas node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[features]
default = ["evaluate"]
evaluate = ["dep:catena-lang", "dep:commonware-runtime", "dep:hellas-store"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dependencies]
async-trait = "0.1"
catena-lang = { workspace = true, optional = true }
commonware-runtime = { workspace = true, optional = true }
futures-core = { workspace = true }
futures-util = "0.3"
hellas-chain = { workspace = true, features = ["client"] }
hellas-kernel = { workspace = true, features = ["secp256k1"] }
hellas-rpc = { workspace = true, features = [
    "execute",
    "evaluate",
    "fetch",
    "courtesy",
    "work",
] }
hellas-store = { workspace = true, optional = true }
hellas-wire = { workspace = true }
hellas-work.workspace = true
prometheus-client = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_ipld_dagcbor.workspace = true
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
