[package]
name = "hellas-reseller"
description = "Vendor adapters using Hellas authority, Work and host services"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[dependencies]
hellas-adaptors.workspace = true
hellas-auth.workspace = true
hellas-authority.workspace = true
hellas-channel.workspace = true
hellas-executor.workspace = true
hellas-providers.workspace = true
hellas-rpc = { workspace = true, features = ["fetch", "work"] }
hellas-sdk.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
axum.workspace = true
futures.workspace = true
hellas-attestation.workspace = true
hellas-authority = { workspace = true, features = ["test-support"] }
hellas-channel = { workspace = true, features = ["test-support"] }
hellas-kernel.workspace = true
hellas-providers = { workspace = true, features = ["test-support"] }
iroh.workspace = true
rcgen = "0.14"
reqwest = { workspace = true, features = ["json"] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
] }
tracing.workspace = true
tracing-subscriber.workspace = true
