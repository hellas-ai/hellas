[package]
name = "hellas-presentation"
description = "Optional host-side text presentation for Hellas clients"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[dependencies]
anyhow = { workspace = true }
hellas-adaptors.workspace = true
hellas-rpc = { workspace = true, features = ["execute"] }
jsonschema = { version = "0.36", default-features = false }
serde_json.workspace = true
thiserror.workspace = true
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
uuid = { version = "1", features = ["v4"] }
