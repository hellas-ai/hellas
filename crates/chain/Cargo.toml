[package]
name = "hellas-chain"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
otel = ["hellas-rpc?/otel"]
# Chain/light-client domain vocabulary: addresses, transactions,
# WebAuthn signature policy, and challenge derivation (`domain` module).
domain = [
    "dep:base64ct",
    "dep:bs58",
    "dep:bytes",
    "dep:commonware-codec",
    "dep:commonware-cryptography",
    "dep:hellas-genesis",
    "dep:hellas-kernel",
    "dep:p256",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "dep:thiserror",
    "dep:url",
    "hellas-kernel/secp256k1",
]
# Consensus wiring aliases in the domain module (threshold scheme types).
domain-consensus = ["domain", "dep:commonware-consensus"]
client = ["client-core", "hellas-wire/ws-rustls"]
client-core = [
    "dep:hellas-rpc",
    "hellas-rpc/chain",
    "dep:commonware-codec",
    "dep:commonware-cryptography",
    "dep:commonware-parallel",
    "dep:hellas-wire",
    # `client.rs` names MuxTransport unconditionally, so client-core has
    # to ask for it. Both real consumers enable a `ws*` feature that
    # happens to pull mux in, which is why selecting client-core on its
    # own was the only way to see this.
    "hellas-wire/mux",
    "dep:p256",
    "dep:rand",
    "dep:thiserror",
    # `client.rs` samples what one validator's RPC cost; the sample's one
    # channel out is `tracing`.
    "dep:tracing",
    # Snapshot finality can require canonical descendant blocks. These are
    # codec dependencies; no archive or consensus participant is started.
    "domain-consensus",
    "dep:commonware-storage",
    "dep:commonware-utils",
]
# The finalized-block codec and accepted-transaction view, without a
# database, a mempool, or consensus participation. This is what an
# endpoint enables to read the block its channel was opened in.
block-view = [
    "client-core",
    "domain-consensus",
    "dep:bytes",
    "dep:commonware-codec",
    "dep:commonware-consensus",
    "dep:commonware-cryptography",
    "dep:commonware-storage",
    "dep:commonware-utils",
]
explorer-origin = [
    "verified-explorer",
    "indexer",
    "dep:axum",
    "axum/ws",
    "dep:redb",
    "hellas-kernel/webauthn",
]
verified-explorer = ["block-view", "dep:serde", "dep:hex", "dep:prost"]
indexer = [
    "block-view",
    "client",
    "dep:bytes",
    "dep:commonware-actor",
    "dep:commonware-codec",
    "dep:commonware-consensus",
    "dep:commonware-cryptography",
    "dep:commonware-glue",
    "dep:commonware-p2p",
    "dep:commonware-parallel",
    "dep:commonware-resolver",
    "dep:commonware-runtime",
    "dep:commonware-storage",
    "dep:commonware-utils",
    "dep:dirs",
    "dep:futures",
    "dep:futures-util",
    "dep:hex",
    "dep:p256",
    "dep:prometheus-client",
    "dep:rand",
    "dep:rand_core",
    "dep:serde",
    "dep:thiserror",
    "dep:tokio",
    "dep:tracing",
    "domain-consensus",
]
server = [
    "dep:hellas-rpc",
    "hellas-rpc/chain",
    "dep:futures-util",
    "dep:hellas-wire",
    "dep:p256",
    "dep:thiserror",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:tokio-tungstenite",
    "dep:tracing",
    "hellas-wire/ws",
    "domain",
    "tokio/net",
    "tokio/rt",
    "tokio/sync",
    "tokio/time",
    "tokio-stream/sync",
]
validator = [
    "indexer",
    "server",
    "dep:axum",
    "dep:commonware-broadcast",
    "dep:rand_core",
    "dep:toml",
    "hellas-kernel/secp256k1",
    "hellas-kernel/webauthn",
]
wasm-client = ["client-core", "hellas-wire/ws-wasm"]
# The block source a paid endpoint's settlement watcher reads. It is its
# own feature because a paid endpoint needs both the block codec and the
# durable work driver, while a chain client that only serves coins has no
# use for either.
work-watcher = ["block-view", "dep:hellas-work"]

[dependencies]
axum = { workspace = true, optional = true }
base64ct = { version = "1", optional = true, features = ["alloc"] }
bs58 = { version = "0.5", optional = true }
bytes = { workspace = true, optional = true }
commonware-actor = { workspace = true, optional = true }
commonware-broadcast = { workspace = true, optional = true }
commonware-codec = { workspace = true, optional = true }
commonware-consensus = { workspace = true, optional = true }
commonware-cryptography = { workspace = true, optional = true, features = [
    "std",
] }
commonware-glue = { workspace = true, optional = true }
commonware-p2p = { workspace = true, optional = true }
commonware-parallel = { workspace = true, optional = true }
commonware-resolver = { workspace = true, optional = true }
commonware-runtime = { workspace = true, optional = true }
commonware-storage = { workspace = true, optional = true }
commonware-utils = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
futures-util = { version = "0.3", optional = true, default-features = false, features = [
    "sink",
] }
hellas-genesis = { workspace = true, optional = true }
hellas-kernel = { workspace = true, optional = true, default-features = false }
hellas-rpc = { workspace = true, optional = true, features = ["chain"] }
hellas-wire = { workspace = true, optional = true }
hellas-work = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
p256 = { workspace = true, optional = true }
prometheus-client = { workspace = true, optional = true }
prost = { version = "0.14", default-features = false, features = [
    "derive",
], optional = true }
rand = { workspace = true, optional = true }
rand_core = { workspace = true, optional = true }
redb = { version = "3", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = [
    "net",
    "rt",
    "sync",
    "time",
] }
tokio-stream = { workspace = true, optional = true, features = ["sync"] }
tokio-tungstenite = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
url = { version = "2", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
commonware-consensus = { workspace = true, features = ["mocks"] }
commonware-cryptography = { workspace = true, features = ["mocks"] }
ed25519-dalek.workspace = true
# The end-to-end money test signs a payment only after the client's own
# re-execution reproduced the provider's answer, and that gate — the
# `Reproducer` seam and the matched/refuted journal transition around it
# — lives in `hellas-client`. Re-deriving it here would be a second
# opinion about the very thing under test. `hellas-client` does not
# depend on `hellas-chain`, so this edge is test-only and acyclic.
hellas-client = { workspace = true, features = ["work"] }
hellas-kernel = { workspace = true, features = ["test-support"] }
# The settlement test drives the endpoint's own close builders against a
# real database, so the bytes a provider would submit are the bytes
# consensus is asked to accept. As a runtime dependency `hellas-rpc`
# arrives without the work protocol; the settlement suite needs it.
hellas-rpc = { workspace = true, features = ["work"] }
# The consensus tests submit close actions built by the endpoint's own
# paid-work helpers. Keep that dependency test-only: production chain code
# only needs it behind the `work-watcher` feature.
hellas-work.workspace = true
serde = { workspace = true, features = ["derive"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
