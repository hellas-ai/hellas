# Paid terms for `hellas admin set-paid-policy --terms faucet-provider.toml
# --expected-revision 0`, after pairing the daemon and funding/delegating stake.
# The owner approves these exact terms; existing offers retain their policy.
# Every field is required unless noted.

# Omit to use the shipped devnet. Select a custom authenticated JSON chain
# profile on the command line with --chain-config chain.json.

jobs_per_channel = 10
# Omit this table to disable Compute. `any` admits every program of one compute
# id, the evaluator a GPU runtime registers; use only = ["<id from hellas
# program>", ...] to restrict programs. Admitting every program hands anyone
# who can submit jobs roughly root on the host, so serve refuses "any" without
# --knowingly-unsafe.
[compute]
any = "hellas/catena-dfad87438018-hip"

[payment]
fixed_price = 20
dispatch_margin_blocks = 4
delivery_margin_blocks = 2
oracle_grace_blocks = 6

[channel]
compute_credit_limit = 40
delivery_credit_limit = 40

[offers]
max_stake_per_client = 12
max_open_offers = 3
# Covers the CLI's 300 admission + 3000 execution + 600 payment blocks,
# with room for channel setup. These are finalized blocks, not seconds.
bond_lifetime_blocks = 10000
# Must exceed fixed_price * jobs_per_channel (200).
omission_bond = 201
redelegate_payout = true

[limits]
# Includes a freshly shipped Whisper program, log-mel features and token masks.
max_upload_bytes = 4194304
max_output_bytes = 1048576
# A text job takes one step per generated token; this admits the text
# command's and the gateway's default token budgets.
max_steps = 256
execution_timeout_ms = 90000

# Caller-signed HTTPS Fetch. Remove this section to sell compute only.
[fetch.limits]
max_request_body_bytes = 65536
max_output_events = 1024
max_spool_bytes = 4194304
max_encoded_result_frame = 1048576
max_encoded_prepared_input = 1048576

[fetch.route.OpenFetch]
require_spki_pin = true
allowed_hosts = []
