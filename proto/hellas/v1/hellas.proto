syntax = "proto3";

package hellas.v1;

// Shared identity, confidential Open and signed transcript messages.

// Numeric values are canonical protocol tags and must not be renumbered.
enum Assurance {
  // Producer-signed is the defined baseline assurance, not an absent value.
  // buf:lint:ignore ENUM_ZERO_VALUE_SUFFIX
  ASSURANCE_PRODUCER_SIGNED = 0;
  ASSURANCE_APPLE_APP_ATTEST = 1;
}

message PublicKey {
  oneof kind {
    bytes secp256k1 = 1;
    bytes ed25519 = 2;
    bytes p256 = 3;
  }
}

message Signature {
  oneof kind {
    bytes secp256k1 = 1;
    bytes ed25519 = 2;
    bytes p256 = 3;
  }
}

// Confidential-open messages are shared by prompt-bearing services so the
// proof is exchanged on the same QUIC connection as the eventual request.
message OpenRequest {
  bytes nonce = 1; // fresh requester nonce; exactly 32 bytes
}

message OpenResponse {
  bytes provider_genesis = 1; // canonical ProviderEnrollmentBundle
  oneof proof {
    Signature producer_signature = 2;
    bytes apple_app_attest_assertion = 3;
  }
}

message InputEventBody {
  uint32 scheme = 1;
  uint64 sequence = 2;
  bytes previous_event = 3;
  string kind = 4;
  bytes payload_commitment = 5;
  bytes signer = 6;
  bytes canonicalization_id = 7;
}

message OutputEventBody {
  uint32 scheme = 1;
  bytes input_commitment = 2;
  bytes stream_id = 3;
  uint64 sequence = 4;
  bytes previous_event = 5;
  string kind = 6;
  bytes payload_commitment = 7;
  bytes signer = 8;
  bytes canonicalization_id = 9;
}

message InputEventEnvelope {
  InputEventBody body = 1;
  Signature signature = 2;
  PublicKey public_key = 3;
  bytes payload = 4;
}

message OutputEventEnvelope {
  OutputEventBody body = 1;
  Signature signature = 2;
  PublicKey public_key = 3;
  bytes payload = 4;
}

message AssuranceEvidence {
  string codec = 1;
  bytes credential = 2;
  bytes proof = 3;
}
