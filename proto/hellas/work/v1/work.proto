syntax = "proto3";

package hellas.work.v1;

import "hellas/v1/hellas.proto";

// The paid-work service: the wire by which a client proposes one job on
// one payment channel and a provider accepts or refuses it.
//
// Nothing here is hashed. Every digest and every signature in the paid
// protocol is taken over the canonical private records in
// `hellas_rpc::protocol::work`, and the `bytes` fields below carry those
// exact encodings. A protobuf re-spelling of an authorization would be a
// second definition of what both parties signed.
service Work {
  rpc Open(.hellas.v1.OpenRequest) returns (.hellas.v1.OpenResponse);

  // One bilateral acceptance. The client sends the authorization it has
  // already signed; the provider answers with its co-signature or with
  // one refusal code.
  rpc AcceptWork(AcceptWorkRequest) returns (AcceptWorkResponse);

  // One whole delivery. The client asks for an accepted job's answer,
  // proving on this connection that it is the client; the provider
  // answers with the complete signed result and the transcript it was
  // derived from, or with one refusal code.
  //
  // This unary form waits for the durable terminal result. The job's
  // price is reserved as delivery credit before release; replay returns
  // the same bytes without a second debit. StreamResult offers signed
  // prefixes under the same authorization and delivery credit. Use StreamResult
  // for Fetch responses that do not fit in one wire frame.
  rpc DeliverResult(DeliverResultRequest) returns (DeliverResultResponse);

  // Authenticated live output. Delivery credit is durably reserved before
  // the first signed prefix leaves. Payment still requires the complete
  // durable terminal result; a disconnect does not cancel accepted work.
  rpc StreamResult(DeliverResultRequest) returns (stream WorkStreamEvent);

  // One payment. The client sends the certificate it has already signed
  // and the private binding saying which job's result it pays for; the
  // provider answers with what it credited, or with one refusal code.
  //
  // There is no separate invoice call, and no provider signature over a
  // price. The provider already co-signed the authorization that fixes
  // the price and signed the result that earns it, so the amount is a
  // number both endpoints derive rather than one either of them quotes.
  //
  // The provider journals the certificate — which is also what retires
  // the job's compute and delivery credit — before it answers. An
  // acknowledgement lost to a crash costs a round trip: the same call
  // made again is credited once and answered the same way.
  rpc AdmitCertificate(AdmitCertificateRequest) returns (AdmitCertificateResponse);
}

// The carrier for the offline two-Open handshake: how the bond and the
// payment channel that every call above presumes get opened by two
// endpoints that have never met.
//
// A separate service from `Work` because it is a separate lifetime. The
// handler here owns a setup journal and no channel; the handler there
// owns a channel and no setup journal. Folding them into one service
// would make every paid method answer for a channel that does not exist
// yet, and every setup method answer for one that already does.
service WorkSetup {
  rpc Open(.hellas.v1.OpenRequest) returns (.hellas.v1.OpenResponse);

  // One step of the handshake: the caller offers the revision it holds,
  // and is answered with the revision that extends it.
  //
  // Symmetric in shape and asymmetric in who acts. The client drives,
  // because the client dials: it asks with nothing and is given the
  // provider's bond proposal, it asks with its own countersigned
  // payment proposal and is given the provider's countersignature.
  //
  // The provider journals every revision — the one it imports and the
  // one it signs — before either leaves the process, which is
  // `SetupStore`'s rule and the reason this is not a function that
  // signs in the handler.
  //
  // A replay of the same call returns the same bytes and writes
  // nothing: the journal recognises a revision it already holds.
  rpc ExchangeSetup(ExchangeSetupRequest) returns (ExchangeSetupResponse);
}

message ExchangeSetupRequest {
  // Canonical `WorkChannelSetupBundleV1` the caller has journaled, or
  // empty to ask for the provider's own proposal.
  //
  // Empty is unambiguous rather than a sentinel: no revision encodes to
  // zero bytes, so there is nothing an empty field could be confused
  // with.
  //
  // Nothing else is carried, and nothing else is needed. The bundle
  // names the network, both parties, and the bond edge this journal is
  // keyed to, and every signature it carries is checked against the
  // party its own terms name — so this request identifies itself and
  // authorises itself out of the same bytes. There is no id here whose
  // possession would grant anything: a caller replaying a captured
  // revision gets back a revision the provider had already exported to
  // the party that signed it, and cannot produce a revision that party
  // did not sign.
  bytes bundle = 1;
}

message ExchangeSetupResponse {
  oneof outcome {
    SetupAdvanced advanced = 1;
    WorkRefused refused = 2;
  }
}

message SetupAdvanced {
  // Canonical `WorkChannelSetupBundleV1`: the revision the answering
  // endpoint has journaled, which is the caller's own plus whatever
  // this endpoint added to it.
  bytes bundle = 1;
}

message AcceptWorkRequest {
  // Canonical `PaidJobAuthorizationV1`, envelope included.
  bytes authorization = 1;
  // The client's compact secp256k1 signature over the work id: exactly
  // 64 bytes. The channel key is native by construction, so there is no
  // key-kind discriminator to disagree with the payment terms.
  bytes client_signature = 2;
  // Canonical `PreparedPaidInputV1`: the inputs the authorization's
  // `prepared_input_digest` commits to, carried so the provider can
  // still execute the job it accepted after the quote that produced
  // them is gone.
  bytes prepared_input = 3;
}

message AcceptWorkResponse {
  oneof outcome {
    WorkAccepted accepted = 1;
    WorkRefused refused = 2;
  }
}

message WorkAccepted {
  // The provider's compact secp256k1 signature over the same work id:
  // exactly 64 bytes.
  bytes provider_signature = 1;
  // The job this answer co-signs. Required when several acceptance
  // exchanges share one channel and responses arrive out of order.
  bytes work_id = 2;
}

message DeliverResultRequest {
  // The accepted job's `work_id`: the authorization's own digest,
  // exactly 32 bytes. Several jobs may be in flight per channel, so
  // every follow-on message selects one explicitly.
  //
  // It is an identifier and not an authority. What authorises the
  // release is the signature below.
  bytes work_id = 1;
  // The client's compact secp256k1 signature over the delivery-request
  // digest: exactly 64 bytes.
  //
  // The digest binds the channel, this job, the action, and the TLS
  // exporter of the connection the request arrives on — so it proves
  // the caller holds the channel's client key *here*, and it is worth
  // nothing replayed on any other connection. A `work_id` travels: it
  // is in the client's own logs, and it is the first thing a peer
  // learns from a proposal. Without this, anyone who saw one could
  // make the provider release the plaintext and durably debit the real
  // client's delivery credit.
  bytes client_signature = 2;
}

message DeliverResultResponse {
  oneof outcome {
    WorkDelivered delivered = 1;
    WorkRefused refused = 2;
  }
}

message WorkDelivered {
  // Canonical `PaidJobResultV1`, envelope included.
  bytes result = 1;
  // The provider's compact secp256k1 signature over the result digest:
  // exactly 64 bytes.
  bytes provider_signature = 2;
  // The signed output events the result summarises, in the encoding
  // `hellas_rpc::protocol::work::decode_transcript` reads. Nothing
  // hashes these bytes: the client rebuilds the result from the decoded
  // events and requires it to be the one above.
  bytes transcript = 3;
}

message AdmitCertificateRequest {
  // The kernel's canonical `EarnedCertificate`: the scalar consensus
  // settles, in the encoding the chain reads.
  bytes certificate = 1;
  // Canonical `PaymentBindingV1`: which job's result that scalar pays
  // for. Private evidence, never consensus input.
  bytes binding = 2;
  // The client's compact secp256k1 signature over the binding digest:
  // exactly 64 bytes.
  bytes binding_signature = 3;
  // The client's compact secp256k1 signature over the kernel's earned
  // digest: exactly 64 bytes. This is the one signature a close spends.
  bytes certificate_signature = 4;
}

message AdmitCertificateResponse {
  oneof outcome {
    WorkPaid paid = 1;
    WorkRefused refused = 2;
  }
}

message WorkPaid {
  // The cumulative amount this provider's credit ledger has now
  // credited. The client requires it to equal the certificate it
  // signed: an acknowledgement of another number is an endpoint that
  // credited something else.
  uint64 credited_cumulative = 1;
}

message WorkRefused {
  WorkRefusalCode code = 1;
  // Diagnostic text for an operator reading a log. Nothing decides on
  // it, and no test asserts its wording.
  string reason = 2;
}

// Why a proposal was not accepted. Closed, and each value says what the
// caller may do next.
enum WorkRefusalCode {
  // Never sent. A response carrying it is malformed.
  WORK_REFUSAL_CODE_UNSPECIFIED = 0;
  // The provider has not caught up to a finalized state it can admit
  // work at. Retryable unchanged.
  WORK_REFUSAL_CODE_NOT_READY = 1;
  // A deadline or the channel's admission horizon has passed. Retrying
  // these bytes cannot succeed; a fresh proposal may.
  WORK_REFUSAL_CODE_EXPIRED = 2;
  // The request is not a well-formed proposal on this channel. Permanent
  // for these bytes, and never a reason to retry as a new paid job
  // without changing them.
  WORK_REFUSAL_CODE_INVALID = 3;
  // A different proposal already occupies this key. Permanent until the
  // job holding it ends.
  WORK_REFUSAL_CODE_CONFLICT = 4;
  // Well-formed and refused by the provider's own admission state:
  // credit exhausted, an unallocated certificate gap, or a job already
  // in flight.
  WORK_REFUSAL_CODE_DECLINED = 5;
  // The provider could not make the state durable. Retryable, and
  // nothing was released.
  WORK_REFUSAL_CODE_UNAVAILABLE = 6;
}

message WorkStreamEvent {
  oneof outcome {
    bytes prefix = 1; // canonical transcript containing signed output events
    WorkDelivered delivered = 2;
    WorkRefused refused = 3;
    // Fetch completion after all nonterminal envelopes in prefix frames.
    // The receiver verifies the assembled transcript against this result.
    WorkStreamTerminal terminal = 4;
  }
}

message WorkStreamTerminal {
  bytes result = 1;
  bytes provider_signature = 2;
  bytes terminal_transcript = 3; // exactly one signed terminal envelope
}
