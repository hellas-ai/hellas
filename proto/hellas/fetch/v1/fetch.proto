syntax = "proto3";

package hellas.fetch.v1;

import "hellas/v1/hellas.proto";

// Fetch signs a manifest-pinned application transform, not raw upstream I/O.
// Request structuring and semantic response destructuring belong to that
// application. The upstream endpoint and every response claim remain
// adversarial; only a platform-backed Assurance authenticates the running app.

message FetchRequest {
  repeated .hellas.v1.InputEventEnvelope input = 1;
}
