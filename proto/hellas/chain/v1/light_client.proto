syntax = "proto3";

package hellas.chain.v1;

// Self-verifying finalized data shared by validators and executing full nodes.
service ChainSync {
  rpc GetLatestBlock(GetLatestBlockRequest) returns (GetFinalizedBlockResponse);
  rpc GetFinalizedBlock(GetFinalizedBlockRequest) returns (GetFinalizedBlockResponse);
  rpc SubscribeFinalized(GetLatestBlockRequest) returns (stream GetFinalizedBlockResponse);
  rpc GetFinalization(GetFinalizationRequest) returns (GetFinalizationResponse);
  rpc GetOperations(GetOperationsRequest) returns (GetOperationsResponse);
}

// Authenticated QMDB operation ranges; the receiver verifies against a certified root.
message GetOperationsRequest {
  uint64 op_count = 1;
  uint64 start = 2;
  uint64 max_ops = 3;
  bool include_pinned_nodes = 4;
}
message GetOperationsResponse {
  bytes proof = 1;
  repeated bytes operations = 2;
  repeated bytes pinned_nodes = 3;
}

service LightClient {
  rpc GetStateRoot(GetStateRootRequest) returns (GetStateRootResponse);
  rpc GetProof(GetProofRequest) returns (GetProofResponse);
  rpc GetCoin(GetCoinRequest) returns (GetCoinResponse);
  rpc GetEdge(GetEdgeRequest) returns (GetEdgeResponse);
  rpc GetFinalization(GetFinalizationRequest) returns (GetFinalizationResponse);
  rpc GetLatestBlock(GetLatestBlockRequest) returns (GetLatestBlockResponse);
  rpc GetFinalizedBlock(GetFinalizedBlockRequest) returns (GetFinalizedBlockResponse);
  rpc SubmitTx(SubmitTxRequest) returns (SubmitTxResponse);
  rpc SubmitWorkResponse(SubmitWorkResponseRequest) returns (SubmitTxResponse);
  rpc SubscribeActivity(SubscribeActivityRequest) returns (stream ActivityEvent);
  rpc GetValidators(GetValidatorsRequest) returns (GetValidatorsResponse);
  rpc GetCoinsByOwner(GetCoinsByOwnerRequest) returns (GetCoinsByOwnerResponse);
  rpc GetEdgesByOwner(GetEdgesByOwnerRequest) returns (GetEdgesByOwnerResponse);
  rpc GetRelayInfo(GetRelayInfoRequest) returns (GetRelayInfoResponse);
  rpc GetConsensusInfo(GetConsensusInfoRequest) returns (GetConsensusInfoResponse);
}

message GetStateRootRequest {}
message GetStateRootResponse {
  optional bytes state_root = 1;
}

message GetProofRequest {
  bytes object_id = 1;
}
message GetProofResponse {
  optional bytes proof = 1;
}

message GetCoinRequest {
  bytes payload = 1;
  bytes object_id = 2;
}
message GetCoinResponse {
  optional bytes owner = 1;
  optional uint64 value = 2;
}

message GetEdgeRequest {
  bytes payload = 1;
  bytes object_id = 2;
}

message KernelFees {
  uint64 base = 1;
  uint64 slot = 2;
  uint64 proof = 3;
  uint64 lifetime = 4;
}

message EdgeState {
  uint64 value = 1;
  uint64 reserve = 2;
  KernelFees close_fees = 3;
  uint64 timeout = 4;
  bytes maker = 5;
  bytes taker = 6;
  bytes terms_hash = 7;
}

message GetEdgeResponse {
  EdgeState edge = 1;
  optional bytes state_root = 2;
}

message GetFinalizationRequest {
  bytes payload = 1;
}
message GetFinalizationResponse {
  optional bytes certificate = 1;
}

message FinalizedSnapshot {
  uint64 height = 1;
  bytes payload = 2;
  bytes state_root = 3;
  bytes finalization = 4;
}

message GetLatestBlockRequest {}
message GetLatestBlockResponse {
  FinalizedSnapshot latest = 1;
}

message GetFinalizedBlockRequest {
  oneof query {
    uint64 height = 1;
    bytes payload = 2;
  }
}

message FinalizedBlock {
  FinalizedSnapshot snapshot = 1;
  bytes block = 2;
}

message GetFinalizedBlockResponse {
  FinalizedBlock block = 1;
}

message SubmitTxRequest {
  oneof tx {
    TransferTx transfer = 1;
    MergeCoinTx merge_coin = 2;
    bytes kernel_tx = 3;
  }
}

// A canonical kernel PaymentCloseResponse body. This method deliberately
// carries no transport identity or caller-supplied admission key.
message SubmitWorkResponseRequest {
  bytes response = 1;
}

message WebAuthnSignature {
  bytes ecdsa_signature = 1;
  bytes authenticator_data = 2;
  bytes client_data_json = 3;
}

message TransferTx {
  bytes input = 1;
  bytes recipient = 2;
  uint64 amount = 3;
  WebAuthnSignature signature = 4;
}

message MergeCoinTx {
  repeated bytes inputs = 1;
  WebAuthnSignature signature = 2;
}

enum SubmitTxOutcome {
  SUBMIT_TX_OUTCOME_UNSPECIFIED = 0;
  SUBMIT_TX_OUTCOME_ENQUEUED = 1;
  SUBMIT_TX_OUTCOME_DUPLICATE = 2;
  SUBMIT_TX_OUTCOME_FULL = 3;
  SUBMIT_TX_OUTCOME_VALIDATION_REJECTED = 4;
}

message SubmitTxResponse {
  SubmitTxOutcome outcome = 1;
}

enum ActivityEventKind {
  ACTIVITY_EVENT_KIND_UNSPECIFIED = 0;
  ACTIVITY_EVENT_KIND_NOTARIZE = 1;
  ACTIVITY_EVENT_KIND_NOTARIZATION = 2;
  ACTIVITY_EVENT_KIND_NULLIFY = 3;
  ACTIVITY_EVENT_KIND_NULLIFICATION = 4;
  ACTIVITY_EVENT_KIND_FINALIZATION = 5;
}

message SubscribeActivityRequest {
  repeated ActivityEventKind urgent_events = 1;
}

message GetValidatorsRequest {}
message GetValidatorsResponse {
  repeated string validators = 1;
}

message GetConsensusInfoRequest {}
message GetConsensusInfoResponse {
  repeated string validators = 1;
  bytes threshold_identity = 2;
  // The network every signature on this chain is domain-separated by.
  // A follower needs it to recompute the authorization hashes it
  // verifies, and learns it here for the same reason it learns the
  // validator set here.
  string network_id = 3;
}

message GetCoinsByOwnerRequest {
  bytes owner = 1;
}

message CoinEntry {
  bytes object_id = 1;
  uint64 value = 2;
}

message GetCoinsByOwnerResponse {
  FinalizedSnapshot snapshot = 1;
  repeated CoinEntry coins = 2;
}

message GetEdgesByOwnerRequest {
  bytes owner = 1;
}

message EdgeEntry {
  bytes object_id = 1;
  bytes maker = 2;
  bytes taker = 3;
}

message GetEdgesByOwnerResponse {
  FinalizedSnapshot snapshot = 1;
  repeated EdgeEntry edges = 2;
}

message ProposalInfo {
  uint64 epoch = 1;
  uint64 view = 2;
  uint64 parent_view = 3;
  bytes parent_payload = 4;
  bytes payload = 5;
}

message NotarizeEvent {
  ProposalInfo proposal = 1;
  uint32 signer = 2;
  bytes signature = 3;
}

message NotarizationEvent {
  ProposalInfo proposal = 1;
  repeated uint32 signers = 2;
  bytes certificate = 3;
}

message NullifyEvent {
  uint64 epoch = 1;
  uint64 view = 2;
  uint32 signer = 3;
  bytes signature = 4;
}

message NullificationEvent {
  uint64 epoch = 1;
  uint64 view = 2;
  repeated uint32 signers = 3;
  bytes certificate = 4;
}

message FinalizationEvent {
  ProposalInfo proposal = 1;
  repeated uint32 signers = 2;
  bytes certificate = 3;
}

message GetRelayInfoRequest {}
message GetRelayInfoResponse {
  string relay_version = 1;
  string relay_rev = 2;
  string node_rpc_version = 3;
  string node_rpc_rev = 4;
}

message ActivityEvent {
  oneof event {
    NotarizeEvent notarize = 1;
    NotarizationEvent notarization = 2;
    NullifyEvent nullify = 3;
    NullificationEvent nullification = 4;
    FinalizationEvent finalization = 5;
  }
  // Ordered unix-millisecond observation times along the delivery path.
  // The validator always records index 0; typed relays may append their own.
  repeated uint64 relay_timestamps = 7;
  string edge_colo = 8;
}
