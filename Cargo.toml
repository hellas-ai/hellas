[workspace]
members = [
    "crates/adaptors",
    "crates/attestation",
    "crates/auth",
    "crates/chain",
    "crates/cli",
    "crates/client",
    "crates/cloud",
    "crates/executor",
    "crates/gateway",
    "crates/genesis",
    "crates/kernel",
    "crates/presentation",
    "crates/private",
    "crates/providers",
    "crates/rpc",
    "crates/sdk",
    "crates/store",
    "crates/wire",
    "crates/work",
    "crates/xet",
]
default-members = ["crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/hellas-ai/hellas"
documentation = "https://docs.rs"

[workspace.dependencies]

anyhow = "1"
async-stream = "0.3"
axum = "0.8"
base64 = "0.23"
bytes = "1"
catena-lang = { git = "https://github.com/georgewhewell/catena-lang", rev = "4d90b4b0b53f68352ff2890203d4de00e1214f93", default-features = false }
cc = "1"
ciborium = "0.2"
commonware-actor = { git = "https://github.com/georgewhewell/commonware-monorepo", rev = "0dd4d0e166b6b10f870dc68d0664b98a42324ddc" }
commonware-broadcast = { git = "https://github.com/georgewhewell/commonware-monorepo", rev = "0dd4d0e166b6b10f870dc68d0664b98a42324ddc" }
commonware-codec = { git = "https://github.com/georgewhewell/commonware-monorepo", rev = "0dd4d0e166b6b10f870dc68d0664b98a42324ddc", default-features = false }
commonware-consensus = { git = "https://github.com/georgewhewell/commonware-monorepo", rev = "0dd4d0e166b6b10f870dc68d0664b98a42324ddc" }
commonware-cryptography = { git = "https://github.com/georgewhewell/commonware-monorepo", rev = "0dd4d0e166b6b10f870dc68d0664b98a42324ddc", default-features = false }
commonware-glue = { git = "https://github.com/georgewhewell/commonware-monorepo", rev = "0dd4d0e166b6b10f870dc68d0664b98a42324ddc" }
commonware-p2p = { git = "https://github.com/georgewhewell/commonware-monorepo", rev = "0dd4d0e166b6b10f870dc68d0664b98a42324ddc" }
commonware-parallel = { git = "https://github.com/georgewhewell/commonware-monorepo", rev = "0dd4d0e166b6b10f870dc68d0664b98a42324ddc" }
commonware-resolver = { git = "https://github.com/georgewhewell/commonware-monorepo", rev = "0dd4d0e166b6b10f870dc68d0664b98a42324ddc" }
commonware-runtime = { git = "https://github.com/georgewhewell/commonware-monorepo", rev = "0dd4d0e166b6b10f870dc68d0664b98a42324ddc" }
commonware-storage = { git = "https://github.com/georgewhewell/commonware-monorepo", rev = "0dd4d0e166b6b10f870dc68d0664b98a42324ddc" }
commonware-utils = { git = "https://github.com/georgewhewell/commonware-monorepo", rev = "0dd4d0e166b6b10f870dc68d0664b98a42324ddc" }
dirs = "7"
ed25519-dalek = { version = "3.0.0", default-features = false }
futures = "0.3"
futures-core = "0.3"
hellas-adaptors = { path = "crates/adaptors", default-features = false }
hellas-attestation = { path = "crates/attestation", default-features = false }
hellas-auth = { path = "crates/auth", default-features = false }
hellas-chain = { path = "crates/chain", default-features = false }
hellas-client = { path = "crates/client", default-features = false }
hellas-cloud = { path = "crates/cloud", default-features = false }
hellas-executor = { path = "crates/executor", default-features = false }
hellas-gateway = { path = "crates/gateway", default-features = false }
hellas-genesis = { path = "crates/genesis", default-features = false }
hellas-kernel = { path = "crates/kernel", default-features = false }
hellas-presentation = { path = "crates/presentation", default-features = false }
hellas-private = { path = "crates/private" }
hellas-providers = { path = "crates/providers", default-features = false }
hellas-rpc = { path = "crates/rpc", default-features = false }
hellas-sdk = { path = "crates/sdk", default-features = false }
hellas-store = { path = "crates/store", default-features = false }
hellas-wire = { path = "crates/wire", default-features = false }
hellas-work = { path = "crates/work", default-features = false }
hellas-xet = { path = "crates/xet", default-features = false }
hex = "0.4"
iroh = { version = "1", default-features = false }
iroh-mdns-address-lookup = "0.6"
k256 = { version = "0.14", features = ["ecdsa"] }
opentelemetry = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = [
    "http-proto",
    "trace",
    "metrics",
    "reqwest-blocking-client",
    "reqwest-rustls",
] }
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
prometheus-client = "0.25"
rand = "0.10"
rand_core = "0.10"
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "webpki-roots",
    "stream",
] }
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_ipld_dagcbor = "=0.7.0"
serde_json = "1"
sha2 = { version = "0.11", default-features = false }
smol_str = "0.3"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "sync",
    "time",
    "process",
] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = "0.30"
toml = "1.1"
tracing = "0.1"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
web-time = "1"
webpki = { package = "rustls-webpki", version = "0.103.9", default-features = false }
x509-cert = { version = "0.3", default-features = false }
