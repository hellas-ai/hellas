name: Publish

# Publishes the exact Hydra evaluation in the dispatch once both channels pass.
# Manual runs can select a revision or the newest common green revision.
on:
  repository_dispatch:
    types: [hydra-channel-advanced]
  workflow_dispatch:
    inputs:
      revision:
        description: "Exact commit to publish (default: newest green revision)"
        required: false
      dry_run:
        description: Resolve and verify without publishing
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: publish
  queue: max

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          extra-conf: |
            extra-substituters = https://cache.hellas.ai
            extra-trusted-public-keys = cache.hellas.ai-1:PYolh95U/Ms5fKE+NQTcNZUHyEv4QikaNocg9I9iy0g=
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          REVISION: ${{ inputs.revision }}
          DRY_RUN: ${{ inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
          HYDRA_JOBSET: ${{ github.event.client_payload.jobset }}
          HYDRA_EVALUATION: ${{ github.event.client_payload.evaluation }}
          HYDRA_REVISION: ${{ github.event.client_payload.revision }}
        run: |
          args=()
          if [ "$EVENT_NAME" = repository_dispatch ]; then
            args+=(--revision "$HYDRA_REVISION" --jobset "$HYDRA_JOBSET" --evaluation "$HYDRA_EVALUATION")
          elif [ -n "$REVISION" ]; then args+=(--revision "$REVISION"); fi
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          nix run --accept-flake-config .#publish -- "${args[@]}"
