name: Publish

# Publishes the newest common green revision; manual runs can select a revision.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      revision:
        description: "Exact commit to publish (default: newest green revision)"
        required: false
      dry_run:
        description: Resolve and verify without publishing
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: publish

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            extra-substituters = https://cache.hellas.ai
            extra-trusted-public-keys = cache.hellas.ai-1:PYolh95U/Ms5fKE+NQTcNZUHyEv4QikaNocg9I9iy0g=
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          REVISION: ${{ inputs.revision }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ -n "$REVISION" ]; then args+=(--revision "$REVISION"); fi
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          nix run --accept-flake-config .#publish -- "${args[@]}"
