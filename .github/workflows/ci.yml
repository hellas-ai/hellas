name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [master, devnet]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Rust checks are Nix derivations built on cargo-deps, the compiled external
  # dependencies, which the hellas Hydra jobset publishes to cache.hellas.ai.
  # These runners only download from that cache; they never upload to it.
  lints:
    name: Lints
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Make room for Nix and Rust
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
      - name: Lints
        run: >-
          nix build --accept-flake-config --print-build-logs --no-link
          .#checks.x86_64-linux.{actions,buf,clippy,deadnix,fmt,nixfmt,no-catgrad-lock,sort,statix,taplo}
      # Not derivations: deny needs the advisory database, the others inspect
      # the dependency graph or one narrow feature set.
      - name: Dependency lints
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          for check in cargo-sources deny channel-dependencies xet-no-alloc; do
            nix run --accept-flake-config ".#check-$check"
          done

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Make room for Nix and Rust
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
      - name: Unit tests
        run: nix build --accept-flake-config --print-build-logs --no-link .#checks.x86_64-linux.unit
