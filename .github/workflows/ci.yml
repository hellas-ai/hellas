name: CI

on:
  workflow_dispatch:
    inputs:
      workspace_regressions:
        description: Run the serial consensus workspace regression check
        type: boolean
        default: false
  schedule:
    - cron: '17 3 * * *'
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Rust checks are Nix derivations built on cargo-deps, the compiled external
  # dependencies, which the hellas Hydra jobset publishes to cache.hellas.ai.
  # These runners only download from that cache; they never upload to it.
  lints:
    name: Lints
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Lints
        run: >-
          nix build --accept-flake-config --print-build-logs --no-link
          .#checks.x86_64-linux.{actions,buf,clippy,deadnix,feature-targets,fmt,nixfmt,no-catgrad-lock,publish,sort,statix,taplo}
      # Hydra only reports evaluation errors after merge, on a tab nobody
      # watches; evaluate every job here so a broken one fails the PR.
      - name: Nix job evaluation
        run: |
          failed=$(nix eval --accept-flake-config --impure --json --expr \
            'import ./nix/ci/eval-jobs.nix { flake = builtins.getFlake ("git+file://" + toString ./.); }')
          if [ "$failed" != "[]" ]; then
            echo "Jobs that fail to evaluate: $failed" >&2
            exit 1
          fi
      - name: Dependency graph checks
        run: >-
          nix build --accept-flake-config --print-build-logs --no-link
          .#checks.x86_64-linux.{cargo-sources,channel-dependencies,provider-dependencies,wasm-chain,wasm-rpc,wasm-xet,xet-no-alloc}
      # The advisory database changes independently of the source revision.
      - name: Dependency lints
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          nix run --accept-flake-config .#check-deny

  # One instrumented run of the workspace tests: it fails on a failing test
  # and prints line coverage without enforcing it.
  # The job name is a required status check; keep it.
  unit-tests:
    name: Unit tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Unit tests + coverage
        run: nix build --accept-flake-config --print-build-logs --no-link .#checks.x86_64-linux.unit

  workspace-regressions:
    name: Workspace regressions
    if: github.event_name == 'schedule' || inputs.workspace_regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'master' || github.ref }}
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Workspace regressions
        run: >-
          nix build --accept-flake-config --print-build-logs --no-link
          .#releaseJobs.consensus.x86_64-linux.checks.regressions
