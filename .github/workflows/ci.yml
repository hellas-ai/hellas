name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Rust checks are Nix derivations built on cargo-deps, the compiled external
  # dependencies, which the hellas Hydra jobset publishes to cache.hellas.ai.
  # These runners only download from that cache; they never upload to it.
  lints:
    name: Lints
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Lints
        run: >-
          nix build --accept-flake-config --print-build-logs --no-link
          .#checks.x86_64-linux.{actions,buf,clippy,deadnix,feature-targets,fmt,nixfmt,no-catgrad-lock,publish,sort,statix,taplo}
      # Hydra only reports evaluation errors after merge, on a tab nobody
      # watches; evaluate every job here so a broken one fails the PR.
      - name: Nix job evaluation
        run: |
          failed=$(nix eval --accept-flake-config --impure --json --expr \
            'import ./nix/ci/eval-jobs.nix { flake = builtins.getFlake ("git+file://" + toString ./.); }')
          if [ "$failed" != "[]" ]; then
            echo "Jobs that fail to evaluate: $failed" >&2
            exit 1
          fi
      - name: Dependency graph checks
        run: >-
          nix build --accept-flake-config --print-build-logs --no-link
          .#checks.x86_64-linux.{cargo-sources,channel-dependencies,provider-dependencies,xet-no-alloc}
      # The advisory database changes independently of the source revision.
      - name: Dependency lints
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          nix run --accept-flake-config .#check-deny

  # One instrumented run of the workspace tests: it fails on a failing test
  # and prints line coverage without enforcing it.
  # The job name is a required status check; keep it.
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Make room for release checks and the native package
        run: |
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux ]]
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/share/swift
          available=$(df -B1 --output=avail / | tail -1)
          (( available >= 40 * 1024 * 1024 * 1024 )) || { echo "Need 40 GiB free for Nix builds" >&2; exit 1; }
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Unit tests + coverage
        run: nix build --accept-flake-config --print-build-logs --no-link .#checks.x86_64-linux.unit
      # Every component uses these same named check derivations on Hydra.
      # Nix deduplicates checks shared by multiple components and the steps above.
      - name: Component release checks
        run: |
          nix build --accept-flake-config --print-build-logs --no-link --max-jobs 1 --impure --expr '
            let flake = builtins.getFlake ("git+file://" + toString ./.);
            in builtins.concatLists (map
              (component: builtins.attrValues component.x86_64-linux.checks)
              (builtins.attrValues flake.releaseJobs))'
      # Exercise buildRustPackage setup hooks in a real shipped package too.
      - name: Native CLI package
        run: nix build --accept-flake-config --print-build-logs --no-link .#packages.x86_64-linux.cli
