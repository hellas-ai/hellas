name: CI

# Trigger model:
#   pull_request → checks + image builds; publish previews for trusted branches
#   push to master / workflow_dispatch → checks + commit-tagged images
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  devshell:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'shared' }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.environment == 'github-hosted'
        uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
      - name: Build dev shell
        run: nix develop --accept-flake-config --command true

  lints:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'shared' }}
    name: Lints
    needs:
      - devshell
    steps:
      - uses: actions/checkout@v4
      - if: runner.environment == 'github-hosted'
        uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
      # This gate crosses feature and target sets in one Cargo target directory.
      # Incremental state alone reaches tens of GiB, which exhausts shared runners
      # without making CI more trustworthy.
      - name: nix run .#check
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: nix run --accept-flake-config .#check

  # ─── release builds ─────────────────────────────────────────────────────
  # Native, cross, and container builds run on PRs and again once merged.
  # Native builds run cargo test as part of buildRustPackage (`doCheck = true`
  # by default), so this stage also covers test execution.

  build-smoke-matrix:
    needs: lints
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'shared' }}
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.environment == 'github-hosted'
        uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
      - id: set-matrix
        name: Enumerate smoke builds
        run: |
          set -Eeu
          matrix="$(
            nix eval --accept-flake-config --json '.#ci.x86_64-linux.builds' --apply '
              builds: {
                include = builtins.attrValues (
                  builtins.mapAttrs (name: attr: { inherit name attr; }) builds
                );
              }
            '
          )"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-smoke:
    needs: build-smoke-matrix
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'shared' }}
    name: build:${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-smoke-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.environment == 'github-hosted'
        uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
      - name: nix build .#${{ matrix.attr }}
        id: build
        run: |
          output=$(nix build --accept-flake-config --print-build-logs --no-link --print-out-paths '.#packages.x86_64-linux.${{ matrix.attr }}')
          echo "output=$output" >> "$GITHUB_OUTPUT"
      - name: Package portable binaries and WASM
        if: startsWith(matrix.name, 'static-') || matrix.name == 'hellas-rpc-wasm'
        env:
          BUILD_NAME: ${{ matrix.name }}
          BUILD_OUTPUT: ${{ steps.build.outputs.output }}
        run: |
          set -euo pipefail
          if [ "$BUILD_NAME" = hellas-rpc-wasm ]; then
            test -s "$BUILD_OUTPUT/lib/libhellas_rpc.rlib"
          else
            test -x "$BUILD_OUTPUT/bin/hellas-cli"
          fi
          mkdir artifacts
          tar --dereference -C "$BUILD_OUTPUT" -czf "artifacts/hellas-$BUILD_NAME-$GITHUB_SHA.tar.gz" .
          cd artifacts
          sha256sum ./*.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: startsWith(matrix.name, 'static-') || matrix.name == 'hellas-rpc-wasm'
        with:
          name: hellas-${{ matrix.name }}
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  build-smoke-passed:
    if: always()
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'shared' }}
    name: Build smoke passed
    needs:
      - build-smoke-matrix
      - build-smoke
    steps:
      - name: Require build-smoke-matrix + all smoke builds succeeded
        run: |
          set -Eeu
          if [[ '${{ needs.build-smoke-matrix.result }}' != success || '${{ needs.build-smoke.result }}' != success ]]; then
            echo '::error::Build smoke validation did not complete: matrix=${{ needs.build-smoke-matrix.result }}, builds=${{ needs.build-smoke.result }}. Inspect the first failed prerequisite, including Lints.'
            exit 1
          fi

  # ─── e2e (PR only) ──────────────────────────────────────────────────────
  # nixosTests run in QEMU VMs. They depend on the same package derivations
  # the build-smoke stage built, so this stage reuses them via the nix store
  # — no rebuilds.

  e2e-matrix:
    if: github.event_name == 'pull_request'
    needs: build-smoke-passed
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'shared' }}
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.environment == 'github-hosted'
        uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
      - id: set-matrix
        name: Enumerate nixosTests
        run: |
          set -Eeu
          matrix="$(
            nix eval --accept-flake-config --json '.#nixosTests.x86_64-linux' --apply '
              tests: { include = map (name: { inherit name; }) (builtins.attrNames tests); }
            '
          )"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  e2e:
    if: github.event_name == 'pull_request'
    needs: e2e-matrix
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'shared' }}
    name: e2e:${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.e2e-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.environment == 'github-hosted'
        uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
      - name: nix build .#nixosTests.x86_64-linux.${{ matrix.name }}
        run: nix build --accept-flake-config --print-build-logs --no-link '.#nixosTests.x86_64-linux.${{ matrix.name }}'

  e2e-passed:
    if: always() && github.event_name == 'pull_request'
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'shared' }}
    name: E2E passed
    needs:
      - e2e-matrix
      - e2e
    steps:
      - name: Require e2e-matrix + all e2e succeeded
        run: |
          set -Eeu
          if [[ '${{ needs.e2e-matrix.result }}' != success || '${{ needs.e2e.result }}' != success ]]; then
            echo '::error::E2E validation did not complete: matrix=${{ needs.e2e-matrix.result }}, tests=${{ needs.e2e.result }}. Inspect the first failed prerequisite, including Lints and Build smoke passed.'
            exit 1
          fi

  # Build archives with read-only permissions. No registry login, Docker daemon,
  # or provider credential is needed. Forks exercise the network variants only.
  images:
    needs: lints
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'shared' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        backend: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && '["network"]' || '["network","cuda","hip"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - if: runner.environment == 'github-hosted'
        uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
      - name: Build ordinary and managed images
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          mkdir images
          for variant in node cloud; do
            attr=docker
            flavor="$BACKEND"
            if [ "$variant" = cloud ]; then
              attr=docker-cloud
              flavor="cloud-$BACKEND"
            fi
            if [ "$BACKEND" != network ]; then
              attr="$attr-$BACKEND"
            fi
            stream=$(nix build --accept-flake-config --print-build-logs --no-link --print-out-paths ".#packages.x86_64-linux.$attr")
            "$stream" | gzip -1 > "images/$flavor.tar.gz"
          done
          cd images
          sha256sum ./*.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: images-${{ matrix.backend }}
          path: images/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  # Publishing consumes image archives only, on a fresh hosted runner. The job
  # never checks out or executes PR scripts with the package-write token.
  publish-images:
    needs: [images, build-smoke-passed, e2e-passed]
    if: >-
      always() &&
      needs.images.result == 'success' &&
      needs.build-smoke-passed.result == 'success' &&
      (github.event_name != 'pull_request' || needs.e2e-passed.result == 'success') &&
      (github.event_name != 'pull_request' ||
        (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        backend: [network, cuda, hip]
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: images-${{ matrix.backend }}
          path: images
      - name: Verify and load archives
        working-directory: images
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          for archive in ./*.tar.gz; do
            docker load --input "$archive"
          done
      - name: Publish commit-tagged images
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND: ${{ matrix.backend }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          config_dir=$(mktemp -d)
          export DOCKER_CONFIG="$config_dir"
          trap 'rm -rf "$config_dir"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          prefix="sha-$GITHUB_SHA"
          if [ -n "$PR_NUMBER" ]; then prefix="pr-$PR_NUMBER-$GITHUB_SHA"; fi
          for flavor in "$BACKEND" "cloud-$BACKEND"; do
            source="ghcr.io/hellas-ai/hellas:$flavor"
            target="$repository:$prefix-$flavor"
            docker tag "$source" "$target"
            docker push "$target"
            digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$target")
            [[ "$digest" == "$repository@sha256:"* ]]
            printf '%s: %s\n\nPull by digest: %s\n\n' "$flavor" "$target" "$digest" >> "$GITHUB_STEP_SUMMARY"
          done
