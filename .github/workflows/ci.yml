name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [master, devnet]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Rust checks are Nix derivations built on cargo-deps, the compiled external
  # dependencies, which the hellas Hydra jobset publishes to cache.hellas.ai.
  # These runners only download from that cache; they never upload to it.
  lints:
    name: Lints
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Lints
        run: >-
          nix build --accept-flake-config --print-build-logs --no-link
          .#checks.x86_64-linux.{actions,buf,clippy,deadnix,feature-targets,fmt,nixfmt,no-catgrad-lock,sort,statix,taplo}
      # Hydra only reports evaluation errors after merge, on a tab nobody
      # watches; evaluate every job here so a broken one fails the PR.
      - name: Nix job evaluation
        run: |
          failed=$(nix eval --accept-flake-config --impure --json --expr \
            "import ./nix/ci/eval-jobs.nix { flake = builtins.getFlake (toString ./.); }")
          if [ "$failed" != "[]" ]; then
            echo "Jobs that fail to evaluate: $failed" >&2
            exit 1
          fi
      # Not derivations: deny needs the advisory database, the others inspect
      # the dependency graph or one narrow feature set.
      - name: Dependency lints
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          for check in cargo-sources deny channel-dependencies xet-no-alloc; do
            nix run --accept-flake-config ".#check-$check"
          done

  # One instrumented run of the workspace tests: it fails on a failing test
  # and on a crate falling below its floor in nix/coverage-floor.json.
  # The job name is a required status check; keep it.
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Unit tests + coverage
        run: nix build --accept-flake-config --print-build-logs --no-link .#checks.x86_64-linux.unit
