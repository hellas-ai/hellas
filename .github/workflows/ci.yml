name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [master, devnet]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lints:
    name: Lints
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Make room for Nix and Rust
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: actions/cache@v4
        with:
          path: target/check
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('flake.lock', 'Cargo.lock', 'rust-toolchain.toml', 'nix/**') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('flake.lock', 'Cargo.lock', 'rust-toolchain.toml', 'nix/**') }}-
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
      - name: Lints
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: nix run --accept-flake-config .#check-lints

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Make room for Nix and Rust
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: actions/cache@v4
        with:
          path: target/check
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('flake.lock', 'Cargo.lock', 'rust-toolchain.toml', 'nix/**') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('flake.lock', 'Cargo.lock', 'rust-toolchain.toml', 'nix/**') }}-
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
      - name: Unit tests
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: nix run --accept-flake-config .#check-unit
