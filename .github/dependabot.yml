version: 2
updates:
  # The root workspace includes every Rust crate and shares one Cargo.lock.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      # Dependabot's "daily" interval skips weekends.
      interval: "cron"
      cronjob: "0 6 * * *"
      timezone: "Europe/Zurich"
    ignore:
      # The executor's compiler protocol uses bincode 1 APIs and encoding.
      - dependency-name: "bincode"
        versions: [">=2"]
      # Catena exposes safetensors 0.7 Dtype values across the crate boundary.
      - dependency-name: "safetensors"
        versions: [">=0.8"]
    groups:
      rust-dependencies:
        patterns:
          - "*"

  # Keep flake input updates in separate PRs. Explicit flake.nix pins stay fixed.
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "03:00"
      timezone: "Europe/Zurich"
